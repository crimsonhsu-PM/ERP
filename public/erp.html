<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNV.PLAN ERP 離線版</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #202124;
      --muted: #646b73;
      --line: #dce1e6;
      --brand: #126a7a;
      --brand-dark: #0a4f5c;
      --brand-soft: #e6f4ff;
      --sider-line: #c8e8ff;
      --danger: #b3261e;
      --ok: #13795b;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; font-family: Arial, "Noto Sans TC", sans-serif; color: var(--text); background: var(--bg); letter-spacing: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
    aside { background: #eaf6ff; border-right: 1px solid var(--sider-line); position: sticky; top: 0; height: 100vh; overflow: auto; }
    .brand { color: #075c78; font-size: 18px; font-weight: 700; padding: 18px 20px; white-space: nowrap; background: #dff2ff; border-bottom: 1px solid var(--sider-line); }
    .nav { padding: 8px 4px; }
    .nav-group { margin: 4px 0; }
    .nav-title { display: flex; align-items: center; gap: 10px; height: 40px; margin: 0 4px; padding: 0 24px; border-radius: 8px; color: #25566f; font-size: 14px; font-weight: 400; line-height: 40px; }
    .nav-title svg, .nav button svg { width: 14px; height: 14px; flex: 0 0 auto; }
    .nav-title::after { content: "⌄"; margin-left: auto; color: rgba(0, 0, 0, 0.45); font-size: 12px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: calc(100% - 8px); min-height: 40px; margin: 4px; text-align: left; border: 0; border-radius: 8px; background: transparent; padding: 0 16px 0 48px; cursor: pointer; color: #25566f; line-height: 40px; transition: background .15s, color .15s; }
    .nav button:hover { background: #d8efff; color: #0b6382; }
    .nav button.active { background: #c8e8ff; color: #075c78; font-weight: 700; }
    main { padding: 24px; min-width: 0; }
    .topbar { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 600; }
    .sub { color: rgba(0, 0, 0, 0.55); margin-top: 6px; }
    .actions, .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .card { background: var(--panel); border: 1px solid #f0f0f0; border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03); }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .stat { background: var(--panel); border: 1px solid #f0f0f0; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03); color: rgba(0, 0, 0, 0.45); }
    .stat b { display: block; font-size: 24px; margin-top: 6px; color: rgba(0, 0, 0, 0.88); font-weight: 600; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); column-gap: 12px; row-gap: 8px; align-items: end; }
    .sales-form-grid { display: grid; grid-template-columns: repeat(auto-fit, 180px); gap: 14px 18px; align-items: end; }
    .sales-detail-card { border: 1px solid #f0f0f0; border-radius: 8px; padding: 12px; margin-top: 16px; margin-bottom: 16px; background: #fff; }
    .sales-detail-title { font-weight: 600; margin-bottom: 10px; }
    .sales-line-row { display: grid; grid-template-columns: minmax(190px, 300px) minmax(160px, 220px) 88px 96px; gap: 8px; margin-bottom: 12px; align-items: end; }
    .sales-line-header { margin-bottom: 6px; color: rgba(0, 0, 0, 0.88); font-weight: 600; }
    .required-column-label::before { content: "*"; color: #ff4d4f; margin-inline-end: 4px; }
    .batch-item-grid, .batch-inventory-grid { display: grid; gap: 8px; }
    .batch-item-row { display: grid; grid-template-columns: 24px 110px minmax(160px, 1fr) 90px 64px 96px 64px; gap: 8px; align-items: center; }
    .batch-inventory-row { display: grid; grid-template-columns: 20px minmax(112px, 1fr) minmax(108px, .8fr) minmax(72px, .52fr) minmax(72px, .52fr) minmax(126px, .92fr) minmax(90px, .78fr) 58px; column-gap: 7px; row-gap: 8px; align-items: center; }
    .batch-item-header { color: rgba(0, 0, 0, 0.88); font-weight: 600; }
    .cash-summary-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .petty-cash-balance { display: flex; min-width: 220px; width: fit-content; padding: 10px 14px; flex-direction: column; gap: 6px; border: 1px solid #d8e7f3; border-radius: 8px; background: #f5fbff; }
    .topbar .actions { display: none; }
    .permissions-stack { display: grid; gap: 16px; }
    .antd-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 8px; margin-bottom: 0; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03); overflow: hidden; }
    .antd-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid #f0f0f0; }
    .antd-card-title { color: rgba(0, 0, 0, 0.88); font-size: 16px; font-weight: 600; }
    .antd-card-body { padding: 16px; }
    .antd-form-row { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); column-gap: 12px; row-gap: 0; align-items: end; }
    .antd-form-actions { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
    .permission-tree { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; padding: 8px 0; }
    .permission-group { border: 1px solid #f0f0f0; border-radius: 8px; padding: 10px; }
    .permission-group strong { display: block; margin-bottom: 6px; }
    .switch { position: relative; display: inline-flex; width: 44px; height: 22px; align-items: center; justify-content: flex-start; border: 0; border-radius: 999px; background: #1677ff; padding: 0 6px; color: #fff; font-size: 12px; }
    .switch.off { justify-content: flex-end; background: rgba(0, 0, 0, 0.25); }
    .switch::after { content: ""; position: absolute; left: 24px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
    .switch.off::after { left: 2px; }
    .switch:disabled { opacity: .45; cursor: not-allowed; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,.45); }
    .modal-panel { width: min(640px, 100%); max-height: calc(100vh - 48px); overflow: auto; background: #fff; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.22); }
    .modal-head, .modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #f0f0f0; }
    .modal-foot { justify-content: flex-end; border-top: 1px solid #f0f0f0; border-bottom: 0; }
    .modal-body { padding: 18px; }
    .modal-space { display: grid; gap: 12px; }
    .alert { padding: 8px 12px; border: 1px solid #ffe58f; border-radius: 6px; background: #fffbe6; color: rgba(0, 0, 0, 0.88); font-size: 14px; }
    label { display: grid; gap: 4px; color: rgba(0, 0, 0, 0.88); font-size: 14px; }
    input, select, textarea { width: 100%; min-height: 32px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 4px 11px; background: #fff; color: rgba(0, 0, 0, 0.88); outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus, select:focus, textarea:focus { border-color: #4096ff; box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1); }
    textarea { min-height: 32px; resize: vertical; }
    .check { display: flex; gap: 8px; align-items: center; height: 32px; color: rgba(0, 0, 0, 0.88); }
    .check input { width: auto; }
    button, .file-btn { min-height: 32px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; padding: 4px 15px; cursor: pointer; color: rgba(0, 0, 0, 0.88); line-height: 1.5715; transition: border-color .15s, color .15s, background .15s; }
    button:hover, .file-btn:hover { color: #1677ff; border-color: #1677ff; }
    button.primary { background: #1677ff; color: white; border-color: #1677ff; }
    button.primary:hover { background: #4096ff; color: white; border-color: #4096ff; }
    button.danger { color: var(--danger); }
    button.danger:hover { border-color: var(--danger); }
    button.ghost { background: transparent; }
    .icon-btn { width: 32px; min-width: 32px; padding: 0; display: inline-grid; place-items: center; font-size: 15px; }
    .table-actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border-bottom: 1px solid #f0f0f0; padding: 8px; text-align: left; vertical-align: middle; font-size: 14px; }
    th { color: rgba(0, 0, 0, 0.88); font-weight: 600; background: #fafafa; position: sticky; top: 0; }
    tbody tr:hover td { background: #fafafa; }
    .table-wrap { overflow: auto; border: 1px solid #f0f0f0; border-radius: 8px; background: white; max-height: calc(100vh - 360px); }
    .badge { display: inline-flex; border-radius: 4px; padding: 1px 7px; border: 1px solid #91caff; background: #e6f4ff; color: #0958d9; font-size: 12px; margin: 2px; }
    .muted { color: var(--muted); }
    .bar { height: 10px; background: #edf2f7; border-radius: 999px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--ok); }
    .dashboard-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .dashboard-daily-card, .dashboard-goal-card { display: grid; gap: 8px; }
    .dashboard-daily-header, .dashboard-goal-header, .dashboard-goal-line { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .statistic-title { color: rgba(0, 0, 0, 0.45); font-size: 14px; }
    .statistic-value { font-size: 24px; line-height: 1.35; font-weight: 600; }
    .small-input { width: 132px; min-height: 24px; padding: 1px 7px; font-size: 14px; }
    .small-btn { min-height: 24px; padding: 0 7px; font-size: 14px; }
    .dashboard-goal-progress { display: grid; gap: 4px; }
    .dashboard-goal-line { align-items: center; }
    .progress { height: 8px; overflow: hidden; border-radius: 999px; background: #f5f5f5; }
    .progress span { display: block; height: 100%; border-radius: inherit; background: #1677ff; }
    .progress-text { color: rgba(0, 0, 0, 0.45); font-size: 13px; text-align: right; }
    .daily-revenue-chart { display: flex; gap: 8px; align-items: end; overflow-x: auto; padding-top: 8px; }
    .daily-revenue-bar-cell { display: grid; grid-template-rows: 150px 22px; gap: 8px; flex: 1 0 18px; align-items: end; padding: 0; border: 0; background: transparent; cursor: pointer; }
    .daily-revenue-bar-wrap { display: flex; height: 150px; align-items: end; border-radius: 6px; background: #eef1f4; overflow: hidden; outline: 1px solid transparent; }
    .daily-revenue-bar-cell:hover .daily-revenue-bar-wrap { outline-color: #0b7f95; background: #e2f3f7; }
    .daily-revenue-bar { width: 100%; border-radius: 6px 6px 0 0; background: #0b7f95; }
    .daily-revenue-day { display: block; text-align: center; font-size: 12px; line-height: 20px; color: rgba(0, 0, 0, 0.45); }
    .revenue-share-layout { display: grid; grid-template-columns: minmax(220px, 260px) minmax(0, 1fr); gap: 20px; align-items: start; overflow: hidden; }
    .revenue-share-pie-panel { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .revenue-share-pie-wrap { position: relative; width: min(240px, 100%); aspect-ratio: 1; }
    .revenue-share-pie { width: 100%; height: 100%; transform: rotate(-90deg); }
    .revenue-share-pie-bg, .revenue-share-pie-segment { fill: none; stroke-width: 18; }
    .revenue-share-pie-segment { cursor: pointer; transition: opacity .15s; }
    .revenue-share-pie-segment.is-dimmed { opacity: .35; }
    .revenue-share-pie-bg { stroke: #eef1f4; }
    .revenue-share-pie-center { position: absolute; inset: 50%; display: flex; width: 132px; height: 132px; padding: 16px; transform: translate(-50%, -50%); flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 1px #edf0f2; }
    .revenue-share-chart, .revenue-share-item-list { display: grid; gap: 10px; min-width: 0; }
    .revenue-share-row { display: grid; grid-template-columns: 28px minmax(130px, 210px) minmax(120px, 1fr) 76px; gap: 10px; align-items: center; min-width: 0; }
    .revenue-share-row.interactive { cursor: pointer; border-radius: 6px; }
    .revenue-share-row.interactive:hover { background: #f5fbff; }
    .revenue-share-child-row { grid-template-columns: 0 minmax(130px, 210px) minmax(120px, 1fr) 76px; color: #4b5563; padding-left: 36px; }
    .revenue-share-rank { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 700; }
    .revenue-share-meta, .revenue-share-value { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .revenue-share-meta strong, .revenue-share-value strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .revenue-share-value { align-items: flex-end; }
    .revenue-share-track { height: 16px; overflow: hidden; border-radius: 999px; background: #eef1f4; }
    .revenue-share-bar { height: 100%; border-radius: inherit; }
    .empty { padding: 24px; text-align: center; color: rgba(0, 0, 0, 0.45); }
    .report-lines { display: grid; gap: 8px; }
    .report-lines hr { width: 100%; border: 0; border-top: 1px solid #f0f0f0; margin: 4px 0; }
    .expand-cell { width: 40px; text-align: center; }
    .expand-btn { display: inline-grid; place-items: center; width: 17px; min-width: 17px; height: 17px; padding: 0; border-radius: 4px; font-size: 12px; line-height: 1; }
    .report-child-row td { padding: 0 0 0 40px; background: #fafafa; }
    .report-child-table { border: 0; border-radius: 0; }
    .report-child-table table { background: transparent; }
    .shift-calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .shift-workday-summary { display: grid; gap: 8px; margin-bottom: 12px; padding: 10px 12px; border: 1px solid #e6f4ff; border-radius: 8px; background: #f6fbff; }
    .shift-workday-groups { display: grid; gap: 8px; }
    .shift-workday-group { display: grid; grid-template-columns: 42px minmax(0, 1fr); align-items: start; gap: 8px; }
    .shift-workday-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .shift-workday-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 4px 10px; border: 1px solid #bae0ff; border-radius: 999px; background: #fff; color: #0f172a; line-height: 1.2; }
    .shift-workday-chip strong { color: #075985; }
    .segmented { display: inline-flex; padding: 2px; border-radius: 6px; background: #f5f5f5; }
    .segmented button { border: 0; min-height: 28px; padding: 2px 11px; background: transparent; }
    .segmented button.active { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); color: #1677ff; }
    .shift-calendar-grid { display: grid; overflow: hidden; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid #edf0f3; border-radius: 8px; }
    .shift-weekday-cell { padding: 10px 8px; border-right: 1px solid #edf0f3; background: #fafafa; font-weight: 700; text-align: center; }
    .shift-weekday-cell:nth-child(7) { border-right: 0; }
    .shift-calendar-week { position: relative; display: grid; grid-column: 1 / -1; grid-template-columns: repeat(7, minmax(0, 1fr)); --range-note-rows: 0; }
    .shift-calendar-empty-cell, .shift-calendar-day { min-height: 112px; padding: 8px; border: 0; border-top: 1px solid #edf0f3; border-right: 1px solid #edf0f3; background: #fff; }
    .shift-calendar-day { display: flex; flex-direction: column; gap: 8px; color: inherit; text-align: left; }
    .shift-calendar-day:hover { background: #f5fbff; }
    .shift-calendar-week > .shift-calendar-empty-cell:last-child, .shift-calendar-week > .shift-calendar-day:last-child { border-right: 0; }
    .shift-calendar-day-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
    .shift-calendar-date { width: fit-content; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: #e6f4ff; color: #075985; font-weight: 700; line-height: 24px; text-align: center; }
    .shift-add-button { display: inline-grid; place-items: center; width: 20px; min-width: 20px; height: 20px; padding: 0; color: rgba(7, 89, 133, 0.56); background: rgba(255, 255, 255, 0.82); border: 1px solid rgba(186, 230, 253, 0.78); border-radius: 999px; box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08); line-height: 1; }
    .shift-range-note-spacer { height: calc(var(--range-note-rows) * 24px); }
    .shift-range-note-bar { position: absolute; z-index: 2; top: calc(38px + var(--range-row) * 24px); left: calc((100% / 7) * var(--range-start) + 8px); width: calc((100% / 7) * var(--range-span) - 16px); height: 20px; padding: 0 10px; border: 0; border-radius: 5px; background: #0ea5e9; color: #fff; cursor: pointer; font-size: 12px; font-weight: 700; line-height: 20px; overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; box-shadow: 0 1px 2px rgba(14, 116, 144, 0.18); }
    .shift-range-note-bar:hover { background: #0284c7; color: #fff; }
    .shift-notes { display: grid; min-width: 0; gap: 3px; color: #075985; font-size: 12px; line-height: 1.35; }
    .shift-notes button, .shift-note-chip { display: block; width: 100%; padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shift-notes button:hover { color: #0284c7; text-decoration: underline; }
    .shift-tags { display: flex; min-width: 0; flex-wrap: wrap; gap: 4px; }
    .shift-tag { display: inline-flex; max-width: 100%; padding: 1px 7px; border: 1px solid #91caff; border-radius: 4px; background: #e6f4ff; color: #0958d9; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shift-tag.charity { border-color: #b7eb8f; background: #f6ffed; color: #389e0d; }
    .shift-modal-panel { width: min(520px, 100%); }
    .shift-existing-list { display: grid; gap: 8px; }
    .shift-existing-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid #f0f0f0; border-radius: 6px; background: #fafafa; }
    .shift-select-wrap { position: relative; margin-top: 6px; }
    .shift-employee-select { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-height: 32px; width: 100%; padding: 1px 11px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; color: rgba(0, 0, 0, 0.25); cursor: pointer; }
    .shift-employee-select.open { border-color: #4096ff; box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1); }
    .shift-select-placeholder { color: rgba(0, 0, 0, 0.25); }
    .shift-select-tag { display: inline-flex; align-items: center; max-width: 100%; min-height: 22px; padding: 0 7px; border-radius: 4px; background: #f5f5f5; color: rgba(0, 0, 0, 0.88); font-size: 12px; }
    .shift-select-dropdown { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0; display: none; max-height: 150px; overflow: auto; padding: 4px; border-radius: 8px; background: #fff; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12); }
    .shift-select-dropdown.open { display: block; }
    .shift-select-option { display: block; width: 100%; min-height: 32px; padding: 5px 12px; border: 0; border-radius: 4px; text-align: left; background: #fff; }
    .shift-select-option:hover { background: #f5f5f5; }
    .shift-select-option.selected { background: #e6f4ff; color: #1677ff; }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      .stats, .form-grid { grid-template-columns: 1fr; }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">UNV.PLAN ERP</div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main>
      <div class="topbar">
        <div>
          <h1 id="title"></h1>
          <div class="sub" id="desc"></div>
        </div>
        <div class="actions">
          <button id="exportBtn">匯出資料</button>
          <label class="file-btn hidden">匯入資料<input id="importFile" class="hidden" type="file" accept="application/json"></label>
          <button class="danger hidden" id="resetBtn">重設開發資料</button>
        </div>
      </div>
      <section id="dashboard"></section>
      <section class="card" id="formCard"></section>
      <section class="card" id="tableCard">
        <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
          <input id="search" placeholder="搜尋目前模組" style="max-width: 320px;">
          <span class="muted" id="count"></span>
        </div>
        <div class="table-wrap"><table id="table"></table></div>
      </section>
    </main>
  </div>
  <script src="./erp-dev-data.js"></script>
  <script>
    const storageKey = "unv.plan.erp.static.v3";
    const today = "2026-08-11";
    const now = "2026-08-11T09:00:00.000Z";
    const defaultMonth = "2026-08";
    const plusDays = (days) => new Date(new Date(`${today}T00:00:00`).getTime() + days * 86400000).toISOString().slice(0, 10);

    function renderShiftsCalendar() {
      const weekdayLabels = ["日", "一", "二", "三", "四", "五", "六"];
      const rosterTags = new Set(["內部員工", "外部員工"]);
      const employees = state.employees || [];
      const tagsById = new Map((state["employee-tags"] || []).map((tag) => [tag.id, tag.name]));
      const employeesById = new Map(employees.map((employee) => [employee.id, employee]));
      const eligibleEmployees = employees.filter((employee) => {
        if (employee.active === false) return false;
        const tagNames = [...(employee.tags || []).map((tag) => tag.name), ...(employee.tagIds || []).map((tagId) => tagsById.get(tagId))].filter(Boolean);
        return tagNames.some((tagName) => rosterTags.has(tagName));
      });
      const monthShiftRows = (state.shifts || []).filter((shift) => dateOnly(shift.startsAt).startsWith(shiftMonth));
      const recordsByDate = monthShiftRows.reduce((map, shift) => {
        const dateKey = dateOnly(shift.startsAt);
        map.set(dateKey, [...(map.get(dateKey) || []), shift]);
        return map;
      }, new Map());
      for (const shifts of recordsByDate.values()) {
        shifts.sort((left, right) => relationLabel("employees", left.employeeId).localeCompare(relationLabel("employees", right.employeeId)));
      }
      const workdayMap = new Map();
      for (const shift of monthShiftRows) {
        if (!shift.employeeId) continue;
        const employee = employeesById.get(shift.employeeId);
        const current = workdayMap.get(shift.employeeId) || { name: employee?.name || shift.employeeId, days: new Set(), category: employee?.role?.includes("兼職") ? "兼職" : employee?.role?.includes("正職") ? "正職" : "其他" };
        current.days.add(dateOnly(shift.startsAt));
        workdayMap.set(shift.employeeId, current);
      }
      const groups = ["正職", "兼職", "其他"].map((label) => ({
        label,
        items: [...workdayMap.entries()]
          .map(([employeeId, value]) => ({ employeeId, name: value.name, count: value.days.size, category: value.category }))
          .filter((item) => item.category === label)
          .sort((left, right) => right.count - left.count || left.name.localeCompare(right.name))
      })).filter((group) => group.items.length > 0);
      const [year, monthNumber] = shiftMonth.split("-").map(Number);
      const leadingEmptyDays = new Date(year, monthNumber - 1, 1).getDay();
      const dayCount = daysInMonth(shiftMonth);
      const cellCount = Math.ceil((leadingEmptyDays + dayCount) / 7) * 7;
      const cells = Array.from({ length: cellCount }, (_, index) => {
        const day = index - leadingEmptyDays + 1;
        return day >= 1 && day <= dayCount ? day : null;
      });
      const weeks = Array.from({ length: cells.length / 7 }, (_, index) => cells.slice(index * 7, index * 7 + 7));
      const dateIndexByKey = new Map();
      cells.forEach((day, index) => {
        if (day) dateIndexByKey.set(dateAt(shiftMonth, day), index);
      });
      const datesByNote = new Map();
      for (const shift of monthShiftRows) {
        const note = String(shift.notes || "").trim();
        const dateKey = dateOnly(shift.startsAt);
        if (!note || !dateIndexByKey.has(dateKey)) continue;
        const noteDates = datesByNote.get(note) || new Map();
        noteDates.set(dateKey, [...(noteDates.get(dateKey) || []), shift.id]);
        datesByNote.set(note, noteDates);
      }
      const segmentsByWeek = new Map();
      const rangeNoteDateKeys = new Set();
      for (const [note, dateRecords] of datesByNote.entries()) {
        const sortedDates = [...dateRecords.keys()].sort();
        let rangeStart = sortedDates[0];
        let previousDate = sortedDates[0];
        const addRange = (startDate, endDate) => {
          if (!startDate || !endDate) return;
          const startIndex = dateIndexByKey.get(startDate);
          const endIndex = dateIndexByKey.get(endDate);
          if (startIndex === undefined || endIndex === undefined || endIndex <= startIndex) return;
          const recordIds = [];
          for (let index = startIndex; index <= endIndex; index += 1) {
            const day = cells[index];
            if (!day) continue;
            const dateKey = dateAt(shiftMonth, day);
            rangeNoteDateKeys.add(`${dateKey}::${note}`);
            recordIds.push(...(dateRecords.get(dateKey) || []));
          }
          const startWeek = Math.floor(startIndex / 7);
          const endWeek = Math.floor(endIndex / 7);
          for (let weekIndex = startWeek; weekIndex <= endWeek; weekIndex += 1) {
            const segmentStartColumn = weekIndex === startWeek ? startIndex % 7 : 0;
            const segmentEndColumn = weekIndex === endWeek ? endIndex % 7 : 6;
            const weekSegments = segmentsByWeek.get(weekIndex) || [];
            const usedRows = [];
            for (const segment of weekSegments) {
              usedRows[segment.row] ||= Array.from({ length: 7 }, () => false);
              for (let column = segment.startColumn; column < segment.startColumn + segment.span; column += 1) usedRows[segment.row][column] = true;
            }
            let row = 0;
            while ((usedRows[row] || []).some((isUsed, column) => isUsed && column >= segmentStartColumn && column <= segmentEndColumn)) row += 1;
            weekSegments.push({ note, startDate, endDate, recordIds, startColumn: segmentStartColumn, span: segmentEndColumn - segmentStartColumn + 1, row });
            segmentsByWeek.set(weekIndex, weekSegments);
          }
        };
        for (const dateKey of sortedDates.slice(1)) {
          if (dateKey === nextDateKey(previousDate)) {
            previousDate = dateKey;
            continue;
          }
          addRange(rangeStart, previousDate);
          rangeStart = dateKey;
          previousDate = dateKey;
        }
        addRange(rangeStart, previousDate);
      }
      const showNotes = shiftDisplayMode === "ALL" || shiftDisplayMode === "NOTES";

      dashboard.innerHTML = `<div class="card">

          <div class="segmented">
            <button class="${shiftDisplayMode === "ALL" ? "active" : ""}" data-shift-mode="ALL">備註＋人員</button>

        </div>
        <div class="shift-calendar-grid">
          ${weekdayLabels.map((weekday) => `<div class="shift-weekday-cell">星期${weekday}</div>`).join("")}
          ${weeks.map((week, weekIndex) => {
            const rangeSegments = segmentsByWeek.get(weekIndex) || [];
            const rangeRowCount = rangeSegments.reduce((max, segment) => Math.max(max, segment.row + 1), 0);
            return `<div class="shift-calendar-week" style="--range-note-rows:${showNotes ? rangeRowCount : 0}">
              ${showNotes ? rangeSegments.map((segment) => `<button class="shift-range-note-bar" type="button" title="${segment.note}" style="--range-start:${segment.startColumn};--range-span:${segment.span};--range-row:${segment.row}" data-shift-range-note="${segment.recordIds.join(",")}">${segment.note}</button>`).join("") : ""}
              ${week.map((day) => {

                return `<div class="shift-calendar-day">

                  ${showNotes && noteRows.length > 0 ? `<span class="shift-notes">${noteRows.map(([note, ids]) => `<button type="button" title="${note}" data-shift-range-note="${ids.join(",")}">${note}</button>`).join("")}</span>` : ""}
                  ${showEmployees ? `<span class="shift-tags">${employeeShifts.map((shift) => `<span class="shift-tag${shift.type === "CHARITY" ? " charity" : ""}">${relationLabel("employees", shift.employeeId) || shift.employeeId}</span>`).join("")}</span>` : ""}
                </div>`;
              }).join("")}
            </div>`;
          }).join("")}
        </div>
      </div>`;
      document.getElementById("shiftMonthInput")?.addEventListener("change", (event) => {

        render();

      document.getElementById("shiftRangeBtn")?.addEventListener("click", addShiftRangeNote);

      };
      document.getElementById("createRoleBtn").onclick = () => renderRoleModal();
      dashboard.querySelectorAll("[data-role-edit]").forEach((button) => button.onclick = () => renderRoleModal((state.roles || []).find((role) => role.id === button.dataset.roleEdit)));
      dashboard.querySelectorAll("[data-role-active]").forEach((button) => button.onclick = () => {
        state.roles = (state.roles || []).map((role) => role.id === button.dataset.roleActive ? { ...role, active: role.active === false } : role);
        save();
        render();
      });
      dashboard.querySelectorAll("[data-user-active]").forEach((button) => button.onclick = () => {
        state.users = (state.users || []).map((user) => user.id === button.dataset.userActive ? { ...user, active: user.active === false } : user);
        save();
        render();
      });
      dashboard.querySelectorAll("[data-user-edit]").forEach((button) => button.onclick = () => {
        editingPermissionUserId = button.dataset.userEdit;
        render();
      });
      document.getElementById("permissionCancelBtn")?.addEventListener("click", () => {
        editingPermissionUserId = "";
        render();
      });
      document.getElementById("permissionSubmitBtn")?.addEventListener("click", () => {
        const roleId = document.getElementById("permissionRole")?.value || "";
        const role = (state.roles || []).find((item) => item.id === roleId);
        if (editingUser) {
          state.users = (state.users || []).map((user) => user.id === editingUser.id ? { ...user, roleId, role: role ? { id: role.id, name: role.name } : null, active: document.getElementById("permissionActive").checked, pagePermissions: role?.pagePermissions || [] } : user);
        } else {
          const email = document.getElementById("permissionEmail")?.value.trim();
          const password = document.getElementById("permissionPassword")?.value || "";
          if (!email || password.length < 6 || !roleId) return alert("請填寫 Email、至少 6 碼密碼與角色。");
          state.users = [{ id: id(), email, name: email, active: document.getElementById("permissionActive").checked, isAdmin: false, roleId, role: role ? { id: role.id, name: role.name } : null, pagePermissions: role?.pagePermissions || [] }, ...(state.users || [])];
        }
        editingPermissionUserId = "";
        save();
        render();
      });
    }
    function tableMarkup(columns, rows) {
      return `<div class="table-wrap" style="max-height:none"><table><thead><tr>${columns.map((column) => `<th>${column[0]}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${columns.map((column) => `<td>${column[1](row)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    function renderForm(config) {
      const key = activeKey();
      const row = editingId ? (state[key] || []).find((item) => item.id === editingId) : {};
      if (key === "sales") {
        renderSalesForm(row);
        return;
      }
      const fields = (config.fields || []).filter(([name]) => !(key === "petty-cash" && name === "notes"));
      let extra = "";
      formCard.classList.remove("hidden");
      formCard.innerHTML = `<form id="entryForm"><div class="form-grid">${fields.map((field) => inputFor(field, row[field[0]] ?? defaultFor(field[2], field[0]))).join("")}${extra}</div><div class="actions" style="margin-top:14px"><button class="primary">${editingId ? "更新" : "新增"}</button>${editingId ? `<button type="button" id="cancelEdit">取消編輯</button>` : ""}</div></form>`;
      entryForm.onsubmit = saveRecord;
      if (editingId) cancelEdit.onclick = () => { editingId = ""; render(); };
    }
    function saveRecord(event) {
      event.preventDefault();
      const key = activeKey();
      const config = modules[key];
      const data = new FormData(event.target);
      const row = editingId ? { ...(state[key] || []).find((item) => item.id === editingId) } : { id: id() };
      for (const [name, , type] of config.fields || []) {
        if (type === "checkbox") row[name] = data.get(name) === "on";
        else if (type === "number") row[name] = Number(data.get(name) || 0);
        else if (name === "tagIds") row[name] = data.get(name) ? [String(data.get(name))] : [];
        else row[name] = String(data.get(name) || "");
      }
      if (key === "employees") {
        row.name = String(row.name || "").trim();
        if (!row.name || !(row.tagIds || []).length) {
          alert("請填寫姓名與 TAG。");
          return;
        }
      }
      if (key === "sales") {
        const lines = salesLineRows
          .filter((line) => line.itemId)
          .map((line) => {
            const quantity = Number(line.quantity || 1);
            const unitPrice = Number(line.unitPrice || byId("items", line.itemId)?.price || 0);
            return { itemId: line.itemId, servicePersonId: line.servicePersonId || "", quantity, unitPrice, lineTotal: quantity * unitPrice };
          });
        row.servicePersonId = lines[0]?.servicePersonId || "";
        row.lines = lines;
        row.subtotal = row.lines.reduce((sum, line) => sum + line.lineTotal, 0);
        row.discount = 0;
        row.total = row.subtotal;
        row.status = "CLOSED";
        salesLineRows = [{ itemId: "", servicePersonId: "", quantity: 1, unitPrice: 0 }];
        salesLineRowsSourceId = "";
      }
      const list = state[key] || [];
      state[key] = editingId ? list.map((item) => item.id === editingId ? row : item) : [row, ...list];
      editingId = "";
      save();
      render();
    }
    function renderTable(config) {
      const key = activeKey();
      const query = search.value.trim().toLowerCase();
      const rows = (state[key] || []).map((row) => enriched(key, row)).filter((row) => JSON.stringify(row).toLowerCase().includes(query));
      count.textContent = `${rows.length} 筆`;
      const columns = config.columns || [];
      const editIcon = `<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 19h1.4l9.2-9.2-1.4-1.4L5 17.6V19Zm-2 2v-4.2L15.6 4.2a2 2 0 0 1 2.8 0l1.4 1.4a2 2 0 0 1 0 2.8L7.2 21H3Zm12.6-12.6-1.4-1.4 1.4 1.4Z"/></svg>`;
      const deleteIcon = `<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 21q-.8 0-1.4-.6Q5 19.8 5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .8-.6 1.4-.6.6-1.4.6H7ZM17 6H7v13h10V6ZM9 17h2V8H9v9Zm4 0h2V8h-2v9Z"/></svg>`;
      const cellHtml = (row, col) => key === "employees" && col === "active"
        ? `<button class="switch${row.active === false ? " off" : ""}" data-employee-active="${row.id}">${row.active === false ? "關" : "開"}</button>`
        : formatCell(row[col], col);
      table.innerHTML = `<thead><tr>${columns.map((col) => `<th>${columnTitle(col)}</th>`).join("")}<th>操作</th></tr></thead><tbody>${rows.map((row) => `<tr>${columns.map((col) => `<td>${cellHtml(row, col)}</td>`).join("")}<td><div class="table-actions"><button class="icon-btn" data-edit="${row.id}" aria-label="編輯" title="編輯">${editIcon}</button><button class="icon-btn danger" data-del="${row.id}" aria-label="刪除" title="刪除">${deleteIcon}</button></div></td></tr>`).join("")}</tbody>`;
      table.querySelectorAll("[data-employee-active]").forEach((button) => button.onclick = () => {
        state.employees = (state.employees || []).map((employee) => employee.id === button.dataset.employeeActive ? { ...employee, active: employee.active === false } : employee);
        save();
        render();
      });
      table.querySelectorAll("[data-edit]").forEach((button) => button.onclick = () => { editingId = button.dataset.edit; render(); window.scrollTo(0, 0); });
      table.querySelectorAll("[data-del]").forEach((button) => button.onclick = () => { if (confirm("確定刪除這筆資料？")) { state[key] = (state[key] || []).filter((row) => row.id !== button.dataset.del); save(); render(); } });
    }
    function columnTitle(col) {
      return ({ soldAt: "日期", customerName: "客戶", salesPerson: "銷售人員", servicePerson: "服務人員", paymentMethod: "付款方式", total: "總額", type: "類型", name: "名稱", price: "售價", cost: "成本", requiresInventory: "需要庫存", stockQuantity: "庫存", active: "啟用", item: "品項", quantity: "數量", movedAt: "日期", reason: "原因", value: "價值", purchasedAt: "購買日期", depreciation: "折舊", amount: "金額", purpose: "用途", employee: "人員", entryDate: "日期", checkedOut: "出帳", phone: "電話", role: "職務", tags: "TAG", event: "活動", startsAt: "開始", endsAt: "結束", location: "地點", title: "標題", term: "期別", registeredAt: "日期", attendeeName: "姓名", status: "狀態", paidAmount: "金額", email: "Email", serviceLink: "服務連結", customer: "客戶", topic: "主題", link: "連結", recordedAt: "日期", courseName: "課程", paidAt: "付款日", category: "分類", description: "說明", sop: "SOP", sortOrder: "排序", owner: "負責" })[col] || col;
    }
    function render() {
      if (current === "reports-yearly") {
        current = "reports-monthly";
        location.hash = current;
        return render();
      }
      const config = current === "events" ? modules[eventTab] : modules[current] || modules.dashboard;
      current = modules[current] ? current : "dashboard";
      title.textContent = current === "events" ? "活動管理" : config.title;
      desc.textContent = current === "events" ? "管理活動、活動品項與報名資料。" : config.desc || "";
      document.body.classList.toggle("page-actions-hidden", current === "permissions" || current === "events");
      dashboard.innerHTML = "";
      formCard.classList.remove("hidden");
      tableCard.classList.remove("hidden");
      renderNav();
      if (current === "events") {
        dashboard.innerHTML = `<div class="row" style="margin-bottom: 14px;"><button class="${eventTab === "event-registrations" ? "primary" : ""}" data-event-tab="event-registrations">活動報名</button><button class="${eventTab === "events" ? "primary" : ""}" data-event-tab="events">活動管理</button></div>`;
        dashboard.querySelectorAll("[data-event-tab]").forEach((button) => button.onclick = () => {
          eventTab = button.dataset.eventTab;
          editingId = "";
          eventItemRows = [{ type: "RITUAL_SERVICE", name: "", price: 0, cost: 0, requiresInventory: false, inventoryQuantity: 0, active: true }];
          eventItemRowsSourceId = "";
          render();
        });
      }
      if (current === "shifts") renderShiftsCalendar();
      else if (config.dashboard) renderDashboard();
      else if (config.report) renderReport();
      else if (config.permissions) renderPermissionsPage();
      else if (current === "events" && eventTab === "events") renderEventsForm(editingId ? (state.events || []).find((item) => item.id === editingId) || {} : {});
      else if (current === "items") renderItemsBatchForm();
      else if (current === "inventory") renderInventoryBatchForm();
      else renderForm(config);
      if (current === "petty-cash" || current === "fixed-expenses") renderCashExtras(current);
      if (!["shifts", "permissions"].includes(current)) renderTable(config);
    }
    search.oninput = render;
    resetBtn.onclick = () => { if (confirm("重設後會清除瀏覽器內的離線資料，並重新帶入開發資料。")) { state = structuredClone(seed); save(); editingId = ""; render(); } };
    exportBtn.onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "unv-plan-erp-data.json" });
      a.click();
      URL.revokeObjectURL(a.href);
    };
    importFile.onchange = async () => {
      const file = importFile.files[0];
      if (!file) return;
      state = { ...structuredClone(seed), ...JSON.parse(await file.text()) };
      save();
      render();
    };
    window.addEventListener("hashchange", () => { current = location.hash.replace("#", "") || "dashboard"; editingId = ""; render(); });
    render();
  </script>
</body>
</html>
