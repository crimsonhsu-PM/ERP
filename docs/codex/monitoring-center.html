<title>監控分析中心</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: mirrors the ERP's Ant Design shell — light-blue Sider menu on the left, white header, layout-grey content.
   Content = 3D island stage + detail panel (stacks on phones). Tokens copied from the ERP's AppThemeProvider. */
:root{
  --sky:#f5f7fa; --sky-2:#eaf6ff; --panel:#ffffff; --card:#f5f7fa; --line:#edf0f2; --line-2:#d9d9d9;
  --ink:#1f1f1f; --muted:#8c8c8c; --accent:#126a7a; --accent-hover:#2b8a99; --accent-soft:#e6f2f3;
  --ok:#52c41a; --warn:#faad14; --alarm:#ff4d4f; --idle:#bfbfbf;
  --sider:#eaf6ff; --menu-ink:#25566f; --menu-hover:#d8efff; --menu-sel:#c8e8ff; --menu-sel-ink:#075c78;
  --shadow:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);
  --f-body:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-display:var(--f-body); --f-num:var(--f-body);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky:#101820; --sky-2:#132634; --panel:#18242e; --card:#1f2d38; --line:#31414e; --line-2:#3e5160;
  --ink:#dfe6ea; --muted:#8a9ba8; --accent:#2b91ad; --accent-hover:#3fa6c2; --accent-soft:#16313c;
  --ok:#49aa19; --warn:#d89614; --alarm:#dc4446; --idle:#5c6b77;
  --sider:#111d27; --menu-ink:#a9bfca; --menu-hover:#1a3443; --menu-sel:#1d5269; --menu-sel-ink:#f3fbff;
  --shadow:0 6px 16px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#101820; --sky-2:#132634; --panel:#18242e; --card:#1f2d38; --line:#31414e; --line-2:#3e5160;
  --ink:#dfe6ea; --muted:#8a9ba8; --accent:#2b91ad; --accent-hover:#3fa6c2; --accent-soft:#16313c;
  --ok:#49aa19; --warn:#d89614; --alarm:#dc4446; --idle:#5c6b77;
  --sider:#111d27; --menu-ink:#a9bfca; --menu-hover:#1a3443; --menu-sel:#1d5269; --menu-sel-ink:#f3fbff;
  --shadow:0 6px 16px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5715;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,select,input,textarea{font-family:var(--f-body)}
.app{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr)}
/* Sider */
.sider{background:var(--sider);overflow-y:auto;min-height:0;padding-block:0 16px;padding-left:max(0px,env(safe-area-inset-left,0px))}
.sider .brandrow{height:56px;display:flex;align-items:center;gap:10px;padding-inline:20px;font-weight:700;color:var(--menu-sel-ink)}
.logo{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.menu{list-style:none;margin:0;padding:0 8px;display:grid;gap:2px}
.menu .grp{font-size:12px;color:var(--muted);padding:12px 16px 4px}
.menu button{appearance:none;width:100%;text-align:left;border:0;background:transparent;color:var(--menu-ink);font-size:14px;height:40px;padding-inline:16px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px}
.menu button:hover:not([disabled]){background:var(--menu-hover)}
.menu button[aria-current="true"]{background:var(--menu-sel);color:var(--menu-sel-ink);font-weight:600}
.menu button[disabled]{opacity:.45;cursor:default}
.menu button .mk{margin-left:auto;font-size:11px;color:var(--muted)}
.menu button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
/* Header */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);min-height:56px;box-sizing:border-box;
  padding-block:8px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0;margin-right:auto}
.brand h1{margin:0;font-size:18px;font-weight:600;color:var(--ink)}
.brand .sub{color:var(--muted);font-size:13px}
.chip{font-size:12px;line-height:20px;padding:0 7px;border-radius:4px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--panel));background:var(--accent-soft);color:var(--accent)}
.clock{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.content{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;min-width:0}
/* Stage */
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 100%)}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas.hot{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px 6px;white-space:nowrap;display:grid;gap:1px;box-shadow:var(--shadow);transition:border-color .2s}
.tag.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent),var(--shadow)}
.tag .n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.tag .v{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tag.s-alarm{border-color:var(--alarm);animation:pulse 1.4s infinite}
.tag.s-stale{opacity:.7;border-style:dashed}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--alarm) 25%,transparent),var(--shadow)}}
.overview{position:absolute;right:136px;bottom:12px;z-index:3}
.fab{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;z-index:3;height:40px;padding:0 18px;font-size:15px;font-weight:600;border-radius:20px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.fab span{font-size:18px;line-height:1}
.goal{display:grid;gap:6px}
.goal .gl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.goal .gl b{color:var(--ink);font-variant-numeric:tabular-nums}
.gbar{height:8px;border-radius:4px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#f5c542,#f2a91c);transition:width .5s}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 8px;border-radius:4px;pointer-events:none}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:calc(100% - 32px);background:color-mix(in srgb,var(--alarm) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--alarm) 35%,var(--panel));color:var(--ink);border-radius:8px;padding:8px 14px;font-size:14px;display:flex;gap:8px;align-items:center;z-index:2;box-shadow:var(--shadow)}
/* status icon: AntD filled-circle icons */
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--s,var(--idle));display:inline-grid;place-items:center;color:#fff;font-size:9px;font-weight:700;line-height:1}
.s-run{--s:var(--ok)} .s-warn{--s:var(--warn)} .s-alarm{--s:var(--alarm)} .s-hub{--s:var(--accent)} .s-stale,.s-idle{--s:var(--idle)}
.dot.s-run::after{content:"✓"} .dot.s-warn::after{content:"!"} .dot.s-alarm::after{content:"✕";font-size:8px} .dot.s-stale::after{content:"–"} .dot.s-hub::after{content:"Σ";font-size:8px}
.rules .dot:not([class*="s-"]){width:8px;height:8px;margin-top:6px}
/* Panel = AntD Card stack */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column;
  padding-block:16px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel section{display:grid;gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.panel section:first-child{padding-top:0}
.panel section:last-child{border-bottom:0}
.eyebrow{font-size:16px;font-weight:600;color:var(--ink)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:2px}
.kpi span{font-size:14px;color:var(--muted)}
.kpi b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--alarm)}
.detail-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-h h2{margin:0;font-size:18px;font-weight:600}
.pill,.sev{font-size:12px;line-height:20px;padding:0 7px;border-radius:4px;border:1px solid color-mix(in srgb,var(--s) 45%,var(--panel));background:color-mix(in srgb,var(--s) 10%,var(--panel));color:color-mix(in srgb,var(--s) 80%,var(--ink));white-space:nowrap}
.detail-h .pill{margin-left:auto}
.tables{display:flex;flex-wrap:wrap;gap:6px}
.tables code,.hint2 code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--ink)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:14px}
.rows dt{color:var(--muted)}
.rows dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.minibars{display:grid;gap:6px}
.minibars div{display:grid;grid-template-columns:52px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.minibars i{display:block;height:8px;border-radius:4px;background:var(--c);min-width:4px;transition:width .5s}
.minibars em{font-style:normal;text-align:right;color:var(--muted)}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;color:var(--muted)}
.rules li.on{color:var(--ink);font-weight:600}
.rules li .dot{margin-top:3px}
/* AntD buttons */
.btn,.btn2,.report,.ghost{appearance:none;font-size:14px;height:32px;padding:0 15px;border-radius:6px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;white-space:nowrap}
.btn,.report{background:var(--accent);color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 12%,transparent)}
.btn:hover,.report:hover{background:var(--accent-hover)}
.btn2,.ghost{background:var(--panel);color:var(--ink);border-color:var(--line-2);box-shadow:0 2px 0 rgba(0,0,0,.02)}
.btn2:hover,.ghost:hover{color:var(--accent);border-color:var(--accent)}
.ghost[aria-pressed="true"]{color:var(--alarm);border-color:var(--alarm)}
.btn[disabled]{background:var(--card);color:var(--muted);border-color:var(--line-2);box-shadow:none;cursor:not-allowed}
.btn:focus-visible,.btn2:focus-visible,.report:focus-visible,.ghost:focus-visible,.tag:focus-visible,.sys:focus-visible,.dcard:focus-visible,.seg button:focus-visible,.rolesel:focus-visible,.tabs button:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.sys{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:22px;padding:0 8px;border-radius:4px;cursor:pointer;color:color-mix(in srgb,var(--s) 80%,var(--ink));background:color-mix(in srgb,var(--s) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--s) 45%,var(--panel))}
.sys .dot{width:12px;height:12px;font-size:8px}
.seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 6%,var(--panel));border-radius:6px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;font-size:14px;color:var(--muted);height:28px;padding:0 11px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 4px -1px rgba(0,0,0,.04)}
.rolesel,.field select,.field input,.field textarea,.sline select,.sline input{font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:6px;box-sizing:border-box;min-width:0;transition:border-color .2s,box-shadow .2s}
.rolesel{height:32px;padding:0 8px}
.rolesel:hover,.field select:hover,.field input:hover,.field textarea:hover{border-color:var(--accent)}
.field select:focus,.field input:focus,.field textarea:focus,.sline select:focus,.sline input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 15%,transparent)}
.empty{color:var(--muted);font-size:14px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.log li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log .msg{min-width:0;overflow-wrap:anywhere}
.log .dot{width:12px;height:12px;font-size:8px}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.plain li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.plain li .dot{margin-top:3px}
.tickets{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.tickets li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.tickets .tid{color:var(--muted);font-size:12px}
.tickets .ttl{min-width:0;overflow-wrap:anywhere}
.tst{grid-row:1/3;grid-column:2;align-self:center;font-size:12px;line-height:20px;padding:0 7px;border-radius:4px;cursor:pointer;border:1px solid color-mix(in srgb,var(--s) 45%,var(--panel));color:color-mix(in srgb,var(--s) 80%,var(--ink));background:color-mix(in srgb,var(--s) 10%,var(--panel))}
/* AntD Modal */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:grid;place-items:center;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dialog{background:var(--panel);border-radius:8px;width:min(560px,100%);max-height:100%;overflow-y:auto;padding:20px 24px;display:grid;gap:16px;box-shadow:var(--shadow)}
.dialog h2{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.dialog h2 .x{margin-left:auto;appearance:none;border:0;background:transparent;border-radius:4px;width:28px;height:28px;font-size:16px;cursor:pointer;color:var(--muted)}
.dialog h2 .x:hover{background:var(--card);color:var(--ink)}
.field{display:grid;gap:6px;font-size:14px}
.field label,.field legend,.flabel{color:var(--ink);font-size:14px;padding:0}
.field select,.field input{height:32px;padding:0 11px;width:100%}
.field textarea{padding:5px 11px;width:100%;min-height:72px;resize:vertical}
fieldset.field{border:0;margin:0;padding:0}
.radios{display:flex;flex-wrap:wrap;gap:0}
.radios label{position:relative;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;height:32px;padding:0 12px;border:1px solid var(--line-2);margin-left:-1px;background:var(--panel);cursor:pointer;margin-bottom:4px}
.radios label:first-child{border-radius:6px 0 0 6px;margin-left:0}
.radios label:last-child{border-radius:0 6px 6px 0}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios label:has(input:checked){color:var(--accent);border-color:var(--accent);position:relative;z-index:1}
.radios label:has(input:focus-visible){outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.snap{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:160px;overflow-y:auto;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.ai{border:1px solid color-mix(in srgb,var(--accent) 30%,var(--panel));border-radius:8px;padding:12px 16px;display:grid;gap:6px;font-size:14px;background:var(--accent-soft)}
.ai h3{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai p{margin:0}
.done{display:grid;gap:12px}
/* Dashboard mode */
.dash{position:absolute;inset:0;overflow-y:auto;background:var(--sky);padding-block:16px;padding-inline:16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.dcard{appearance:none;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:8px;cursor:pointer;align-content:start;transition:box-shadow .2s,border-color .2s}
.dcard:hover{box-shadow:var(--shadow)}
.dcard.sel{border-color:var(--accent)}
.dcard .dh{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.dcard .dh .pill{margin-left:auto;font-weight:400}
.dcard .dm{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.dcard .dr{font-size:13px;color:var(--muted);min-height:1.4em}
.dcard.s-alarm{border-color:color-mix(in srgb,var(--alarm) 50%,var(--panel))} .dcard.s-alarm .dr{color:var(--alarm)} .dcard.s-warn .dr{color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
/* AntD Tabs (line) */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.tabs button{appearance:none;border:0;background:transparent;font-size:14px;color:var(--ink);padding:10px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--accent-hover)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
/* forms */
.fform{display:grid;gap:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow>*{min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.total span{color:var(--muted);font-size:14px}
.total b{font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.msg{font-size:14px;border-radius:6px;padding:8px 12px;border:1px solid}
.msg.ok{color:color-mix(in srgb,var(--ok) 80%,var(--ink));background:color-mix(in srgb,var(--ok) 8%,var(--panel));border-color:color-mix(in srgb,var(--ok) 40%,var(--panel))}
.msg.err{color:color-mix(in srgb,var(--alarm) 85%,var(--ink));background:color-mix(in srgb,var(--alarm) 8%,var(--panel));border-color:color-mix(in srgb,var(--alarm) 40%,var(--panel))}
.hint2{margin:0;font-size:12px;color:var(--muted)}
.lhead,.sline{display:grid;grid-template-columns:58px minmax(0,1fr) 64px 28px;gap:6px;align-items:center}
.lhead{font-size:12px;color:var(--muted);padding-inline:8px}
.slines{display:grid;gap:8px}
.sline{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px}
.sline select{grid-column:1/-1;height:32px;padding:0 8px;width:100%}
.sline input{height:32px;padding:0 8px;width:100%}
.lSub{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.lDel{appearance:none;border:0;background:transparent;color:var(--muted);border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:14px}
.lDel:hover{color:var(--alarm);background:color-mix(in srgb,var(--alarm) 8%,var(--panel))}
.addline{appearance:none;font-size:14px;height:32px;border:1px dashed var(--line-2);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.addline:hover{border-color:var(--accent);color:var(--accent)}
/* analysis */

    case 'hub': return {st:'hub',rules:[['所有模組的營收、支出與點燈資料彙總到這裡',true]]};
    case 'sales': return {st:D.open?'warn':'run',reason:D.open?D.open+' 筆銷售單尚未結帳':null,
      rules:[['Sale.status = OPEN 超過 0 筆 → 黃燈',D.open>0],['今日營收低於上月同日均值 50% → 黃燈',false]]};
    case 'lamp': return {st:'run',rules:[['點燈資料正常寫入 LampRecord → 綠燈',true],['去年點燈、今年未續點 → 提醒（待規劃）',false]]};
    case 'event': { const p=D.event.reg-D.event.paid; const full=D.event.reg>=D.event.cap;
      const w=(p>0&&D.event.daysLeft<=5)||full;
      return {st:w?'warn':'run',reason:full?'名額已滿':(p>0&&D.event.daysLeft<=5?p+' 位報名者尚未付款，活動剩 '+D.event.daysLeft+' 天':null),
      rules:[['EventRegistration.status = REGISTERED 且活動 5 天內 → 黃燈',p>0&&D.event.daysLeft<=5],['報名人數達名額上限 → 黃燈',full]]}; }
    case 'stock': { const l=lowStock();
      return {st:l.length?'alarm':'run',reason:l.length?l.map(s=>s.name).join('、')+' 低於安全庫存':null,
      rules:[['庫存量 < 安全庫存 → 紅燈（需新增 Item.safetyStock 欄位）',l.length>0]]}; }
    case 'service': return {st:D.service.pending?'warn':'run',reason:D.service.pending?D.service.pending+' 筆課程匯款待確認':null,
      rules:[['CoursePayment.status = 待確認 → 黃燈',D.service.pending>0]]};
    case 'staff': { const n=D.staff.on; return {st:n===0?'alarm':n<2?'warn':'run',reason:n===0?'營業時間內沒有人在班':n<2?'只有 1 人在班（通常 2 人）':null,
      rules:[['營業時間（12:00–21:00）內無人在班 → 紅燈',n===0],['在班少於 2 人 → 黃燈',n===1],['公益服務人員不計入正式人力',false]]}; }
    case 'ops': {
      const r=[
        ['API 無回應 → 紅燈（由前端判斷）',offline,'alarm'],
        ['DB 連線失敗 → 紅燈',!H.db.ok,'alarm'],
        ['API 5xx 錯誤率 > 2% → 黃燈',H.api.err>2,'warn'],
        ['DB 查詢 > 500ms 或 database is locked → 黃燈',H.db.lat>500||H.db.locked,'warn'],
        ['最後備份超過 24 小時 → 黃燈',H.db.backupHrs>24,'warn'],
        ['LINE webhook 或 OpenAI 呼叫失敗 → 黃燈（LINE 登記營收暫停）',!H.line.ok||!H.openai.ok,'warn'],
      ];
      const st=r.some(x=>x[1]&&x[2]==='alarm')?'alarm':r.some(x=>x[1])?'warn':'run';
      return {st,rules:r.map(x=>[x[0],x[1]])};
    }
  }
}
function mainMetric(id){
  return {hub:'本月 '+NT(D.month), sales:'今日 '+NT(D.today), lamp:'今年 '+fmt(lampTotal())+' 盞',
    event:'報名 '+D.event.reg+' / '+D.event.cap, stock:'低庫存 '+lowStock().length+' 項',

    ops: offline?'API 無回應':'API '+H.api.lat+'ms・DB '+(H.db.ok?H.db.lat+'ms':'離線')}[id];

    add(rg,B(W,0.05,L),dm,0,-0.06,side*L/2);
    for(let i=0;i<n;i++) add(rg,C(0.085,0.085,L,10),tm,-W/2+0.085+i*((W-0.17)/(n-1)),0,side*L/2,{rx:Math.PI/2});

renderer.domElement.addEventListener('pointerup',e=>{ if(downAt&&Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])<5){ const id=hit(e); if(id) select(id);} downAt=null; });

/* ---------- simulation: new ERP records arrive ---------- */
const COL={sales:0x2b91ad,lamp:0xffcf4d,event:0xc4b5ff,stock:0xd9a46c,service:0x8fdcc4,staff:0x8fcbf0};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function healthTick(){
  H.api.lat=Math.round(95+Math.random()*60); H.db.backupHrs+=0.4;
  H.api.err=+(H.api.err>2?(Math.random()<0.3?0.4:H.api.err):(Math.random()<0.04?3.6:0.2+Math.random()*0.4)).toFixed(1);
  if(H.db.lat>500||H.db.locked){ if(Math.random()<0.35){ H.db.lat=18; H.db.locked=false; log('run','DB 回應恢復正常'); } }
  else { H.db.lat=Math.round(12+Math.random()*14); if(Math.random()<0.04){ H.db.lat=680; log('warn','DB 查詢變慢（680ms）'); } else if(Math.random()<0.03){ H.db.locked=true; log('warn','DB 寫入衝突：database is locked'); } }
  ['line','openai'].forEach(k=>{ if(!H[k].ok){ if(Math.random()<0.3){ H[k].ok=true; log('run',(k==='line'?'LINE webhook':'OpenAI')+' 恢復連線'); } } else if(Math.random()<0.025){ H[k].ok=false; log('warn',(k==='line'?'LINE webhook 簽章驗證失敗':'OpenAI 呼叫逾時，LINE 營收登記暫停')); } });
  if(H.db.backupHrs>24&&H.db.backupHrs<24.4) log('warn','已超過 24 小時沒有備份');
}
function tick(){
  if(offline){ renderAll(); return; }
  lastOk=Date.now(); healthTick();
  const r=Math.random();
  if(r<0.38){ const it=rnd(ITEMS), who=rnd(PEOPLE), pay=rnd(PAY), amt=it.price||rnd([300,600,1000,2000]); D.today+=amt; D.month+=amt; D.todayN++; D.monthN++; track(it,1,amt);
    if(it.stock){ const s=D.stock.find(x=>x.name===it.stock); if(s) s.qty=Math.max(0,s.qty-1); }
    const open=Math.random()<0.12; if(open) D.open++;
    log(open?'warn':'run',who+' · '+it.name+' · '+pay+' '+fmt(amt)+(open?'（未結帳）':'')); sendPacket('sales',COL.sales);
  } else if(r<0.55){ const L=rnd(LAMPS); D.lamps[L.k]++; log('run',rnd(PEOPLE)+' 點了一盞'+L.label); sendPacket('lamp',L.hex);
  } else if(r<0.7){ if(D.event.reg<D.event.cap){ D.event.reg++; const paid=Math.random()<0.5; if(paid) D.event.paid++;
      log(paid?'run':'warn',rnd(PEOPLE)+' 報名'+D.event.title+(paid?'（已付款）':'（待付款）')); sendPacket('event',COL.event); }
  } else if(r<0.8){ if(Math.random()<0.5){ D.service.pending++; log('warn','收到一筆線上課程匯款，待確認'); } else { D.service.week++; log('run','新增客服紀錄：'+rnd(['課程時間詢問','改約時間','點燈流程詢問'])); } sendPacket('service',COL.service);
  } else if(r<0.9){ const s=rnd(D.stock); const q=1+Math.floor(Math.random()*2); s.qty=Math.max(0,s.qty-q); log(s.qty<s.safe?'alarm':'run',s.name+' 耗用 '+q+' 件，剩 '+s.qty); sendPacket('stock',COL.stock);
  } else { const before=D.staff.on; D.staff.on=before===2?(Math.random()<0.6?3:1):2; if(D.staff.on!==before){ const r=D.roster[Math.max(before,D.staff.on)-1]; log(D.staff.on<2?'warn':'run',r.name+(D.staff.on>before?(r.cat==='公益'?' 公益服務報到':' 回到崗位'):(r.cat==='公益'?' 公益服務結束':' 暫時離開'))+'，現在 '+D.staff.on+' 人在班'); sendPacket('staff',COL.staff); } }
  renderAll();
}

  event:()=>{ log('run','已發送付款提醒，'+(D.event.reg-D.event.paid)+' 位完成付款'); D.event.paid=D.event.reg; },
  stock:()=>{ const l=lowStock(); l.forEach(s=>s.qty=s.safe*2); log('run','已建立進貨單：'+l.map(s=>s.name).join('、')); },

function renderAnalysis(s,d){

  const vals=D.daily.map((v,i)=>i+1===D.td?D.today:v), top=Math.ceil(Math.max(...vals,D.target)/10000)*10000;
  const W=320,H=150,pl=26,pr=4,pt=10,pb=18,bw=(W-pl-pr)/D.dim, y=v=>pt+(H-pt-pb)*(1-v/top);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" class="wk" role="img" aria-label="本月每日營收長條圖">';
  [0,0.5,1].forEach(f=>{ const v=top*f, yy=y(v).toFixed(1); svg+='<line x1="'+pl+'" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(+yy+3)+'" text-anchor="end" font-size="8" fill="var(--muted)">'+(v/1000)+'k</text>'; });
  vals.forEach((v,i)=>{ const x=pl+i*bw+bw*0.15, w=bw*0.7, t=i+1===D.td, fut=i+1>D.td;
    if(!fut&&v>0) svg+='<rect x="'+x.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(H-pb-y(v)).toFixed(1)+'" rx="1.5" fill="'+(t?'var(--accent)':'color-mix(in srgb,var(--accent) 35%,var(--panel))')+'"><title>'+(new Date().getMonth()+1)+'/'+(i+1)+'：'+fmt(v)+'</title></rect>';

function resize(){ const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false);
  const a=w/h, d=Math.max(9,12/a); cam.left=-d*a; cam.right=d*a; cam.top=d; cam.bottom=-d; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

const v3=new THREE.Vector3(), clock=new THREE.Clock();
function frame(){
  if(IS_MOBILE) return;
  const t=clock.getElapsedTime();
  ISL.forEach(s=>{ if(!reduce) s.group.position.y=Math.sin(t*0.9+s.group.userData.phase)*0.13;
    const al=s.ev&&s.ev.st==='alarm'; s.balGroup.position.y=Math.sin(t*(al?4:1.4)+s.group.userData.phase)*(al?0.12:0.06); s.balGroup.rotation.z=Math.sin(t*1.2+s.group.userData.phase)*0.06; });
  anim.forEach(f=>f(reduce?0:t));
  for(let i=packets.length-1;i>=0;i--){ const p=packets[i]; p.t+=reduce?0.02:0.012;
    const pos=p.br.end.clone().lerp(p.br.start,p.t); pos.y=0.5+Math.sin(p.t*Math.PI)*0.6; p.mesh.position.copy(pos);
    if(p.t>=1){ scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); packets.splice(i,1); } }
  if(!reduce) clouds.forEach((c,k)=>{ c.position.x+=0.005+k*0.0006; if(c.position.x>16) c.position.x=-16; });
  if(mode==='dash'){ requestAnimationFrame(frame); return; }
  if(camAnim){ const k=Math.min(1,(performance.now()-camAnim.t0)/700), e=1-Math.pow(1-k,3);
    controls.target.lerpVectors(camAnim.from,camAnim.to,e); cam.position.copy(controls.target).add(camAnim.off); cam.zoom=camAnim.z0+(camAnim.z1-camAnim.z0)*e; cam.updateProjectionMatrix(); if(k>=1) camAnim=null; }
  controls.update(); renderer.render(scene,cam);
  const w=stage.clientWidth,h=stage.clientHeight;
  ISL.forEach(s=>{ v3.set(s.pos[0],s.group.position.y+s.tagH*s.sc,s.pos[2]).project(cam); s.tag.style.left=((v3.x+1)/2*w)+'px'; s.tag.style.top=((1-v3.y)/2*h)+'px'; });
  requestAnimationFrame(frame);
}

  const now=new Date(), time=(now.getMonth()+1)+'/'+now.getDate()+' '+hm(now);
  TICKETS.unshift({id,time,module,impact,desc,st:0,sev:a.sev});
  const text=['【問題回報】'+id,'功能：'+module,'影響：'+impact,'嚴重度（AI 初判）：'+a.sev,'描述：'+desc,'AI 初判原因：'+a.what,'','— 系統快照 —',snapshot()].join('\n');
  document.getElementById('doneText').textContent=text;
  document.getElementById('doneNote').textContent='已建立工單 '+id+'。正式版會自動推送到工程師的 LINE 群組或 Email；示範版可以先複製下面的內容貼過去。';
  document.getElementById('formView').hidden=true; document.getElementById('doneView').hidden=false;
  log(a.c==='alarm'?'alarm':'warn','新回報 '+id+'：'+module+'・'+impact);
  tab='status'; document.getElementById('detail').dataset.view=''; selected='ops'; renderAll(); document.getElementById('copyBtn').focus();
});
document.getElementById('copyBtn').addEventListener('click',()=>{
  const btn=document.getElementById('copyBtn'), txt=document.getElementById('doneText').textContent;
  const sel=()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById('doneText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent='已選取，請按複製'; };
  try{ navigator.clipboard.writeText(txt).then(()=>{ btn.textContent='已複製'; },sel); }catch(e){ sel(); }
});

let camAnim=null; const HOME=new THREE.Vector3(0,0,0);
function moveCam(to,z1){ const off=cam.position.clone().sub(controls.target);
  camAnim={from:controls.target.clone(),to,off,z0:cam.zoom,z1,t0:performance.now()-(reduce?700:0)}; }
function focusOn(id){ if(mode!=='island') return; const s=byId(id); if(!s) return;
  moveCam(new THREE.Vector3(s.pos[0],1.0*s.sc,s.pos[2]),s.id==='sales'?2.2:2.5); document.getElementById('overviewBtn').hidden=false; }

/* ---------- ERP 側邊選單（對應 pagePermissions）---------- */
const MENU=[['營收',[['monitor','監控分析中心',null],['dashboard','數據總覽','hub'],['sales','營收登記','sales:form']]],
  ['管理',[['items','進銷項目',null],['employees','人員管理',null],['shifts','排班紀錄','staff']]],
  ['報表',[['reports-monthly','月報表','hub'],['reports-yearly','年報表',null]]],
  ['資產',[['inventory','庫存紀錄','stock'],['petty-cash','零用支出',null],['fixed-expenses','固定支出',null]]],
  ['活動',[['events','活動管理','event']]],
  ['服務',[['lighting','點燈紀錄','lamp:form'],['sops','SOP',null],['customer-service-records','客服紀錄','service']]],
  ['系統',[['permissions','權限設定','ops']]]];
const STAFF_KEYS=['monitor','sales','inventory','events','lighting','sops','customer-service-records'];
function renderMenu(){
  const cur=selected+(tab!=='status'?':'+tab:'');
  document.getElementById('menu').innerHTML=MENU.map(([g,items])=>{ const vis=items.filter(([k])=>role==='admin'||STAFF_KEYS.includes(k)); if(!vis.length) return '';
    return '<li class="grp">'+g+'</li>'+vis.map(([k,l,t])=>{ const on=k==='monitor'?false:(t&&(t===cur||(t===selected&&tab==='status')));
      return '<li><button type="button" data-k="'+k+'"'+(t||k==='monitor'?'':' disabled title="示範未包含此頁"')+' aria-current="'+(k==='monitor'?(!MENU.flatMap(x=>x[1]).some(i=>i[2]&&(i[2]===cur||(i[2]===selected&&tab==='status')))):on)+'">'+l+(t?'':'')+'</button></li>'; }).join(''); }).join('');
  document.querySelectorAll('#menu button[data-k]').forEach(b=>b.onclick=()=>{ const it=MENU.flatMap(x=>x[1]).find(i=>i[0]===b.dataset.k); if(!it) return;
    if(it[0]==='monitor'){ select('hub'); return; } const [id,t]=it[2].split(':'); select(id,t||'status'); });
}

/* ---------- 儀表板模式 & 身分 ---------- */
const STNAME={run:'正常',warn:'注意',alarm:'需處理',hub:'彙總',stale:'資料過期'};
function renderDash(){
  const g=document.getElementById('dgrid');
  g.innerHTML=ISL.filter(s=>visible(s.id)).map(s=>{ const e=s.ev;
    return '<button type="button" class="dcard s-'+e.st+(s.id===selected?' sel':'')+'" data-id="'+s.id+'">'+
      '<div class="dh"><span class="dot s-'+e.st+'"></span><span>'+s.name+'</span><span class="pill s-'+e.st+'">'+STNAME[e.st]+'</span></div>'+
      '<div class="dm">'+mainMetric(s.id)+'</div><div class="dr">'+(e.st==='stale'?'連線中斷，顯示最後一次資料':e.reason||(s.id==='ops'?(e.st==='run'?'各項服務正常':'有服務需要注意'):'一切正常'))+'</div></button>'; }).join('');
  g.querySelectorAll('.dcard').forEach(b=>b.onclick=()=>select(b.dataset.id));
}
function setMode(m){ mode=m; document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  const isDash=m==='dash'; document.getElementById('dash').hidden=!isDash; renderer.domElement.hidden=isDash; labelsEl.hidden=isDash; document.getElementById('hint').hidden=isDash;
  try{ localStorage.setItem('unv-island-mode',m); }catch(e){}
  renderAll(); }
function applyRole(){
  ISL.forEach(s=>{ const v=visible(s.id); s.group.visible=v; s.tag.hidden=!v; if(bridges[s.id]) bridges[s.id].g.visible=v&&visible('hub'); });
  document.getElementById('kpiSec').hidden=role==='staff'; document.getElementById('sysChip').hidden=role==='staff';
  if(!visible(selected)){ selected=ISL.find(s=>visible(s.id)).id; tab='status'; document.getElementById('detail').dataset.view=''; }
  renderAll(); }
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('roleSel').onchange=e=>{ role=e.target.value; log('run','切換為'+(role==='staff'?'櫃台人員':'管理者')+'視角'); applyRole(); };
